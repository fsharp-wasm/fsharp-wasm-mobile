name: CI

on:
  push:
  pull_request:

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: The catalogue is valid and docs/apis.md is what apis.json says
        run: node tools/catalogue.mjs --check
